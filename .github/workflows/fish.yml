name: generate arcade

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: generate puzzle bobble
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: lykabhabescairo37-maker
          games: 'puzzle-bobble'
      - name: push to output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
