name: Generate Unique Pac-Man

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate pink pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: lykabhabescairo37-maker
          theme: dracula-dark
          player_style: aggressive

      - name: push to output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
